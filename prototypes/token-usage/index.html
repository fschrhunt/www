<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Token usage · Reference study</title>
<link rel="icon" type="image/png" sizes="32x32" href="./favicon.png">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#3565c5;color:#f0f1f3;font:12px/16px ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}header{position:fixed;z-index:2;top:16px;left:50%;transform:translateX(-50%);width:min(712px,100%);padding:0 16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:9px;min-width:44px;min-height:44px;font-size:13px;margin-left:0;pointer-events:auto}a:focus-visible{outline:1px solid #f0f1f3;outline-offset:2px}.total{font-variant-numeric:tabular-nums}main{position:relative;height:100dvh;width:100%;outline:none;touch-action:pan-x pinch-zoom;cursor:default}#timeline{height:100%;width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x pinch-zoom;user-select:none}#timeline::-webkit-scrollbar{display:none}#scrub{position:absolute;left:0;right:0;bottom:calc(50% - var(--half-chart,152px) - 28px);height:calc(var(--half-chart,152px) + var(--half-chart,152px) + 28px);touch-action:pinch-zoom}#bars{position:relative;height:100%;pointer-events:none}.dragging{cursor:grabbing}.day{position:absolute;bottom:calc(50% - var(--half-chart,152px));width:1px;display:flex;flex-direction:column;gap:2px;align-items:stretch}.segment{background:#e5e8ee;min-height:1px}.day.month .segment:first-child{background:#bfcbe2}.cursor{position:absolute;bottom:calc(50% - var(--half-chart,152px));height:min(380px,calc(50dvh + var(--half-chart,152px) - 140px));width:2px;background:#cbd5e8;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .13s}.cursor.visible{opacity:1}.date{position:absolute;top:100%;margin-top:12px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#e0e6f0;font-size:13px;line-height:19.5px}.details{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:16px;min-width:190px;font-size:14px;line-height:20px;color:#f0f1f3}.row{display:flex;margin-top:4px;align-items:center;gap:12px;white-space:nowrap}.row .price{margin-left:auto;color:inherit;font-variant-numeric:tabular-nums}.mark{display:block;flex:0 0 14px;width:14px;height:14px;color:inherit}.provider-mark{background:currentColor;mask:var(--provider-icon) center/contain no-repeat;-webkit-mask:var(--provider-icon) center/contain no-repeat}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:480px){header{top:20px;padding:0 24px}.details{min-width:172px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><a href="http://localhost:3107/" aria-label="Back to home"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M5.5 4 1.5 8m0 0 4 4m-4-4H10a2.5 2.5 0 0 0 0-5H8.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" /></svg></a><span id="total" class="total" title="Fictional data for this visual prototype"></span></header>
<main id="chart" tabindex="0" role="slider" aria-orientation="horizontal" aria-label="Sample daily token cost. Scroll or drag horizontally, or use left and right arrows to explore dates. Press M to mute sounds." aria-valuemin="0" aria-valuemax="179" aria-valuenow="179">
<h1 class="sr-only">Token usage reference study, using fictional data</h1>
<div id="timeline"><div id="bars" aria-hidden="true"></div></div>
<div id="scrub" aria-hidden="true"></div>
<div id="cursor" class="cursor" aria-hidden="true"><div id="details" class="details"></div><div id="date" class="date"></div></div>
</main>
<script src="./provider-icons.js"></script>
<script>
// Fictional daily costs reproduce the reference's sparse rhythm without presenting someone else's usage as Fischer's.
const days=Array.from({length:180},(_,i)=>{let n=Math.abs(Math.sin(i*78.233+4.17)*43758.5453)%1;let value=Math.pow(n,2.7)*28+1;if(i>124&&i<139)value*=4.6;if(i>163)value*=8.5;if(i===172)value=260;if(i===168)value=194;const date=new Date(Date.UTC(2026,2,13+i));return{date,a:+(value*.87).toFixed(2),b:+(value*.09).toFixed(2),c:+(value*.04).toFixed(2)}});
const chart=document.querySelector('#chart'),bars=document.querySelector('#bars'),timeline=document.querySelector('#timeline'),cursor=document.querySelector('#cursor'),details=document.querySelector('#details'),dateText=document.querySelector('#date');
let active=-1,visible=false,muted=false,unlocked=false,audio=null,offset=0,pitch=11,first=0,lastTick=0,last=179,guideX=0,guideTarget=0,guideVelocity=0,frame=0,previousTime=0,drag=null,anchorX=innerWidth/2,initialized=false;
const cost=n=>'$'+n.toFixed(2);
document.querySelector('#total').textContent=cost(days.reduce((n,d)=>n+d.a+d.b+d.c,0));
// Create short noise transients for movement and clicks; audio is unlocked by the first click, tap, or key press.
function unlock(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{});unlocked=true}catch{}}
function sound(kind){if(!unlocked||muted||!audio)return;const now=performance.now();if(kind==='tick'&&now-lastTick<22)return;lastTick=now;const time=audio.currentTime;const source=audio.createBufferSource();const duration=kind==='tick'?.003:kind==='click'?.006:.012;const buffer=audio.createBuffer(1,Math.ceil(audio.sampleRate*duration),audio.sampleRate);const channel=buffer.getChannelData(0);const decay=kind==='tick'?16:kind==='click'?42:65;for(let i=0;i<channel.length;i++)channel[i]=(Math.random()*2-1)*Math.exp(-i/decay);source.buffer=buffer;const filter=audio.createBiquadFilter();filter.type=kind==='tick'?'highpass':'bandpass';filter.frequency.value=kind==='tick'?3500:kind==='click'?4200:1600;filter.Q.value=kind==='click'?2.5:.7;const gain=audio.createGain();gain.gain.value=kind==='tick'?.19:kind==='click'?.28:.16;source.connect(filter);filter.connect(gain);gain.connect(audio.destination);source.start(time);source.onended=()=>{source.disconnect();filter.disconnect();gain.disconnect()}}
// A native horizontal scroller keeps every date reachable with trackpads and touch momentum.
function render(){const width=chart.clientWidth,oldMax=timeline.scrollWidth-width,position=initialized&&oldMax>0?timeline.scrollLeft/oldMax:.5;const trackWidth=Math.max(width,(days.length-1)*pitch+49),padding=(trackWidth-((days.length-1)*pitch+1))/2;const max=Math.max(...days.map(d=>d.a+d.b+d.c),1),scale=Math.min(300,Math.max(40,innerHeight-230));const heights=days.map(d=>[d.a,d.b,d.c].filter(v=>v>0).sort((a,b)=>b-a).map(v=>Math.max(1,Math.min(300,v/max*scale))));const height=Math.max(...heights.map(h=>h.reduce((a,b)=>a+b,0)+Math.max(0,h.length-1)*2));chart.style.setProperty('--half-chart',height/2+'px');bars.style.width=trackWidth+'px';bars.dataset.padding=padding;bars.innerHTML=days.map((d,i)=>'<div class="day '+(i===0||d.date.getUTCDate()===1?'month':'')+'" style="left:'+(padding+i*pitch)+'px">'+heights[i].map(h=>'<i class="segment" style="height:'+h+'px"></i>').join('')+'</div>').join('');first=0;last=days.length-1;chart.setAttribute('aria-valuemin',first);chart.setAttribute('aria-valuemax',last);timeline.scrollLeft=position*(trackWidth-width);offset=padding-timeline.scrollLeft;initialized=true;if(visible)select(active,false)}
// Follow date changes with the reference's damped spring, retaining immediate placement for reduced motion.
function moveGuide(x){guideTarget=x;if(!visible||matchMedia('(prefers-reduced-motion: reduce)').matches){cancelAnimationFrame(frame);frame=0;guideVelocity=0;guideX=x;cursor.style.left=x+'px';return}if(!frame){previousTime=performance.now();frame=requestAnimationFrame(stepGuide)}}
function stepGuide(time){const dt=Math.min((time-previousTime)/1000,1/60);previousTime=time;guideVelocity+=(500*(guideTarget-guideX)-40*guideVelocity)*dt;guideX+=guideVelocity*dt;cursor.style.left=guideX+'px';if(Math.abs(guideTarget-guideX)<.02&&Math.abs(guideVelocity)<.02){guideX=guideTarget;cursor.style.left=guideX+'px';frame=0;return}frame=requestAnimationFrame(stepGuide)}
function label(date){const day=date.getUTCDate();const suffix=day%10===1&&day!==11?'st':day%10===2&&day!==12?'nd':day%10===3&&day!==13?'rd':'th';return date.toLocaleDateString('en-US',{month:'short',timeZone:'UTC'})+' '+day+suffix}
// Render model labels as text and resolve each creator's mark separately from the usage source.
function renderUsageRows(rows){details.replaceChildren(...rows.map(item=>{const row=document.createElement('div');row.className='row';const name=document.createElement('span');name.textContent=item.name;const price=document.createElement('span');price.className='price';price.textContent=cost(item.value);row.append(ProviderIcons.create(item.modelId,item.creator),name,price);return row}))}
// The only revealed text is the selected date and its per-model cost, placed beside the moving guide.
function select(index,feedback=true){index=Math.min(last,Math.max(first,index));const changed=index!==active||!visible;active=index;const d=days[index],x=offset+index*pitch;moveGuide(x);const detailX=Math.max(108,Math.min(innerWidth-108,x));details.style.left=(detailX-x)+'px';const dateX=Math.max(42,Math.min(innerWidth-42,x));dateText.style.left=(dateX-x)+'px';renderUsageRows([{modelId:'gpt-5.5',name:'GPT 5.5',value:d.a},{modelId:'claude-opus-4.8',name:'Opus 4.8',value:d.b+d.c}]);dateText.textContent=label(d.date);chart.setAttribute('aria-valuenow',index);chart.setAttribute('aria-valuetext',label(d.date)+', '+cost(d.a+d.b+d.c));if(feedback&&changed)sound(visible?'tick':'enter');visible=true;cursor.classList.add('visible')}
function hide(){if(!visible)return;visible=false;cursor.classList.remove('visible');sound('leave')}
// Mouse dragging pans; touch drags inspect the bars or scroll through empty space.
function explore(event){anchorX=event.clientX;const bounds=document.querySelector('#scrub').getBoundingClientRect();if(event.clientY<bounds.top||event.clientY>bounds.bottom){hide();return}select(Math.round((event.clientX-offset)/pitch))}
chart.addEventListener('pointerdown',e=>{if(e.button!==0||!e.isPrimary)return;unlock();anchorX=e.clientX;drag={id:e.pointerId,x:e.clientX,scroll:timeline.scrollLeft,moved:false,type:e.pointerType,scrub:e.target.id==='scrub'};if(e.pointerType==='mouse'){e.preventDefault();chart.focus({preventScroll:true});chart.setPointerCapture(e.pointerId)}else if(drag.scrub){chart.setPointerCapture(e.pointerId)}explore(e);sound('click')});
chart.addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId){const dx=e.clientX-drag.x;if(Math.abs(dx)>4)drag.moved=true;if(drag.type==='mouse'&&drag.moved){chart.classList.add('dragging');timeline.scrollLeft=drag.scroll-dx;return}if(drag.type==='touch'){if(drag.scrub)explore(e);return}}explore(e)});
function endDrag(e){if(!drag||drag.id!==e.pointerId)return;const tap=!drag.moved;if(chart.hasPointerCapture(e.pointerId))chart.releasePointerCapture(e.pointerId);drag=null;chart.classList.remove('dragging');if(e.type==='pointerup'&&tap)explore(e)}
chart.addEventListener('pointerup',endDrag);chart.addEventListener('pointercancel',endDrag);chart.addEventListener('lostpointercapture',()=>{drag=null;chart.classList.remove('dragging')});chart.addEventListener('pointerleave',()=>{if(!drag)hide()});
timeline.addEventListener('scroll',()=>{offset=Number(bars.dataset.padding)-timeline.scrollLeft;if(visible)select(Math.round((anchorX-offset)/pitch))},{passive:true});
// Route horizontal wheel deltas through the scroller even when the bar inspection layer is under the pointer.
chart.addEventListener('wheel',e=>{if(e.ctrlKey)return;e.preventDefault();const delta=e.deltaX||(e.shiftKey?e.deltaY:0);if(!delta)return;anchorX=e.clientX;const unit=e.deltaMode===1?16:e.deltaMode===2?timeline.clientWidth:1;timeline.scrollLeft+=delta*unit;offset=Number(bars.dataset.padding)-timeline.scrollLeft;explore(e)},{passive:false});
// Keyboard navigation spans the complete history and scrolls selected dates into view.
chart.addEventListener('keydown',e=>{unlock();if(e.key.toLowerCase()==='m'){muted=!muted;return}if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();return}if(!['ArrowLeft','ArrowRight','Home','End','Escape'].includes(e.key))return;e.preventDefault();if(e.key==='Escape'){hide();chart.blur();return}const index=Math.max(first,Math.min(last,e.key==='Home'?first:e.key==='End'?last:active<0?Math.round((innerWidth/2-offset)/pitch):active+(e.key==='ArrowRight'?1:-1)));const x=offset+index*pitch;if(x<40)timeline.scrollLeft-=40-x;else if(x>innerWidth-40)timeline.scrollLeft+=x-(innerWidth-40);offset=Number(bars.dataset.padding)-timeline.scrollLeft;anchorX=offset+index*pitch;select(index)});
chart.addEventListener('blur',hide);document.addEventListener('pointerdown',unlock,{capture:true});document.addEventListener('pointerup',unlock,{capture:true});document.addEventListener('click',unlock,{capture:true});document.addEventListener('keydown',unlock,{capture:true});window.addEventListener('resize',render);render();
</script>
</body></html>
