name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    # Branch protection requires this exact name.
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Glob so every scripts/*.test.mjs runs, including content.test.mjs and any test added later.
      - run: node --test scripts/*.test.mjs
      - name: Test usage operations
        env:
          PYTHONPATH: ops/token-usage/runtime:ops/token-usage/setup
        run: python3 -B -m unittest discover -s ops/token-usage/tests -p 'test_*.py'
      - name: Require a site update timestamp
        if: github.event_name == 'pull_request'
        env:
          SITE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run site:check
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
