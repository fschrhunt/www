name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck:
    # Job name is load-bearing — branch protection matches this literal string.
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
