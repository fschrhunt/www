version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      npm-maintenance:
        patterns: ['*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']
    # Toolchain major upgrades need a coordinated compatibility review.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
